name: streetact

networks:
  internal:
    driver: bridge

volumes:
  db-data:

services:
  # ---------------------------------------------------------------------
  # PostgreSQL (moteur Supabase) — jamais exposé sur l'hôte.
  # ---------------------------------------------------------------------
  db:
    image: supabase/postgres:15.6.1.146
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/99-schema.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # GoTrue — Authentification (JWT, signup/login/refresh). Interne uniquement.
  # ---------------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}
    networks: [internal]

  # ---------------------------------------------------------------------
  # PostgREST — API REST auto-générée sur Postgres (lectures non critiques
  # côté client : profil, historique de parties). Interne uniquement.
  # ---------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: 3000
    networks: [internal]

  # ---------------------------------------------------------------------
  # Serveur de jeu Unity Headless — AUTORITAIRE. Seul service (avec nginx)
  # exposé sur l'hôte, sur le port de jeu.
  # ---------------------------------------------------------------------
  game-server:
    build:
      context: ./game-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GAME_PORT: 7777
      REST_URL: http://rest:3000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    ports:
      - "${GAME_SERVER_PORT}:7777"
    networks: [internal]

  # ---------------------------------------------------------------------
  # Nginx — reverse proxy public (80/443) vers auth/rest, TLS.
  # ---------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [auth, rest]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    networks: [internal]
