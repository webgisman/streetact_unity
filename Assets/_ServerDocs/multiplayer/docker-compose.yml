name: novgov

networks:
  internal:
    driver: bridge

volumes:
  db-data:
  # Cache disque L2 de géométrie tactique (murs/grille/portes/fenêtres par bâtiment, voir
  # TacticalGridBuilder.cs) — survit à un redéploiement (contrairement au système de fichiers du
  # conteneur, recréé à chaque "docker compose up -d"). Sans ce volume, un redéploiement payait à
  # nouveau la reconstruction complète depuis la scène Unity (fetch OSM + bake NavMesh pour une
  # tuile GPS réelle, jusqu'à ~60s) pour chaque carte déjà vue avant le redémarrage (2026-08-30).
  # Utile même à une seule instance : conservé au travers des redéploiements du conteneur.
  tactical-grid-cache:

services:
  # ---------------------------------------------------------------------
  # PostgreSQL (moteur Supabase) — jamais exposé sur l'hôte.
  # ---------------------------------------------------------------------
  db:
    image: supabase/postgres:15.6.1.146
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/99-schema.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # GoTrue — Authentification (JWT, signup/login/refresh). Interne uniquement.
  # ---------------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM}
    networks: [internal]

  # ---------------------------------------------------------------------
  # PostgREST — API REST auto-générée sur Postgres (lectures non critiques
  # côté client : profil, historique de parties). Interne uniquement.
  # ---------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: 3000
    networks: [internal]

  # ---------------------------------------------------------------------
  # Serveur de jeu Unity Headless — AUTORITAIRE. POOL DE 3 INSTANCES RÉTABLI (2026-09-13) : la
  # bascule "Deathmatch/Zone de Contrôle utilisent maintenant de vraies UnitAI/BuildingStructure de
  # scène" (voir MatchSessionManager_MatchLive.cs, 09-real-unity-combat-investigation-2026-09-13.md)
  # réintroduit la contrainte "un seul match à la fois par processus" que l'Option B du 2026-08-30
  # avait supprimée — chaque processus ne peut de nouveau faire tourner qu'UN match (Deathmatch,
  # Zone de Contrôle OU Conquête) à la fois. Remettre 3 instances redonne 3 matchs simultanés au lieu
  # d'un seul, exactement le mécanisme que le commentaire d'origine (voir git blame) avait laissé prêt
  # à réactiver "si le besoin (résilience, pas capacité) s'en faisait sentir" — sauf qu'ici c'est bien
  # redevenu un besoin de CAPACITÉ, pas seulement de résilience. La table "server_instances"
  # (schema.sql §7) et la logique côté client (MultiplayerMatchController.ConnectToGameServerCoroutine,
  # "choisir une instance libre") n'ont eu besoin d'AUCUNE modification pour ça — elles géraient déjà
  # une table à N lignes avant la consolidation à 1 seule instance.
  #
  # IMPORTANT pour un déploiement VPS réel : les ports 7778/7779 avaient été FERMÉS dans UFW lors de
  # la consolidation à 1 instance (voir 01-deployment-vps.md) — il faut les rouvrir
  # (`ufw allow 7778/tcp && ufw allow 7779/tcp`) avant que game-server-2/3 soient réellement
  # joignables depuis l'extérieur, sinon ils tournent mais restent inaccessibles.
  # ---------------------------------------------------------------------
  game-server-1:
    build:
      context: ./game-server
    image: novgov-game-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GAME_PORT: 7777
      REST_URL: https://novgov.com/rest/v1
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      INSTANCE_ID: game-server-1
      PUBLIC_PORT: 7777
    volumes:
      - tactical-grid-cache:/root/.config/unity3d/DefaultCompany/Novgov/TacticalGridCache
    ports:
      - "7777:7777"
    networks: [internal]

  game-server-2:
    build:
      context: ./game-server
    image: novgov-game-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GAME_PORT: 7777
      REST_URL: https://novgov.com/rest/v1
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      INSTANCE_ID: game-server-2
      PUBLIC_PORT: 7778
    volumes:
      - tactical-grid-cache:/root/.config/unity3d/DefaultCompany/Novgov/TacticalGridCache
    ports:
      - "7778:7777"
    networks: [internal]

  game-server-3:
    build:
      context: ./game-server
    image: novgov-game-server:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET}
      GAME_PORT: 7777
      REST_URL: https://novgov.com/rest/v1
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      INSTANCE_ID: game-server-3
      PUBLIC_PORT: 7779
    volumes:
      - tactical-grid-cache:/root/.config/unity3d/DefaultCompany/Novgov/TacticalGridCache
    ports:
      - "7779:7777"
    networks: [internal]

  # ---------------------------------------------------------------------
  # Nginx — reverse proxy public (80/443) vers auth/rest, TLS.
  # ---------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [auth, rest]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    networks: [internal]
