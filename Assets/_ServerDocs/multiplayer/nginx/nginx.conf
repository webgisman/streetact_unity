worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Limite basique anti-abus sur les endpoints d'auth
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name novgov.com;

        # Nécessaire pour le renouvellement certbot en mode standalone (pre/post-hook
        # arrête/redémarre nginx) — sinon, passer en mode webroot pour éviter la coupure.
        location / { return 301 https://$host$request_uri; }

        location /health {
            return 200 "ok";
        }
    }

    server {
        listen 443 ssl;
        server_name novgov.com;

        ssl_certificate     /etc/letsencrypt/live/novgov.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/novgov.com/privkey.pem;

        location /auth/v1/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://auth:9999/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /rest/v1/ {
            proxy_pass http://rest:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            return 200 "ok";
        }
    }
}
